<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F10" />

    <!-- Primary meta -->
    <title>BraveVest — Access Verified Investment Opportunities</title>
    <meta name="description" content="BraveVest Marketplace gives investors access to verified investment opportunities across real estate, agriculture, energy and credit-backed products." />
    <meta name="author" content="Bravelion Holdings" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://brave-vest.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BraveVest" />
    <meta property="og:title" content="BraveVest — Access Verified Investment Opportunities" />
    <meta property="og:description" content="Verified investment opportunities across real estate, agriculture, energy, and credit-backed products." />
    <meta property="og:url" content="https://brave-vest.vercel.app/" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BraveVest — Access Verified Investment Opportunities" />
    <meta name="twitter:description" content="Verified investment opportunities across real estate, agriculture, energy, and credit-backed products." />

    <!-- Performance: DNS + connection hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- Fonts: swap in so text renders immediately on slow connections -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BraveVest",
        "url": "https://brave-vest.vercel.app",
        "description": "Verified investment opportunities across real estate, agriculture, energy, and credit-backed products.",
        "parentOrganization": { "@type": "Organization", "name": "Bravelion Holdings" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:40px;font-family:system-ui,sans-serif;text-align:center;max-width:600px;margin:0 auto">
        <h1 style="font-size:24px">BraveVest</h1>
        <p style="color:#6B6B6B;line-height:1.6">
          BraveVest Marketplace gives investors access to verified investment opportunities
          across real estate, agriculture, energy, and credit-backed products.
        </p>
        <p style="color:#6B6B6B">Please enable JavaScript to use the marketplace.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "bravevest-web/**"
      - ".github/workflows/deploy-web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bravevest-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bravevest-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        env:
          GITHUB_PAGES: "true"
          VITE_API_BASE_URL: "https://api.bravevest.com/api"
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist
          test -f dist/index.html || (echo "missing index.html" && exit 1)
          test -f dist/404.html || (echo "missing 404.html" && exit 1)
          test -f dist/.nojekyll || (echo "missing .nojekyll" && exit 1)
          echo "build OK"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bravevest-web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
